<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZX Spectrum!</title>
<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        color: #333;
    }

    header {
        background-color: #003366;
        color: #ffffff;
        padding: 20px 40px;
        font-size: 24px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    header .logo {
        font-size: 28px;
    }

    main {
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
    }

    .panel {
        background-color: #ffffff;
        border: 1px solid #c0c0c0;
        border-radius: 5px;
        width: 320px;
        text-align: center;
        padding: 30px 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .panel h2 {
        margin-top: 0;
        color: #003366;
    }

    .btn {
        display: block;
        margin: 15px auto;
        padding: 12px 25px;
        background-color: #0078d4;
        color: #fff;
        text-decoration: none;
        border-radius: 3px;
        font-weight: bold;
        transition: background 0.2s;
    }

    .btn:hover {
        background-color: #005a9e;
    }

    .dev-build {
        font-family: "Courier New", monospace;
        color: #900;
        margin-top: 15px;
        font-size: 14px;
    }

    footer {
        background-color: #003366;
        color: #ccc;
        text-align: center;
        padding: 15px 0;
        margin-top: 40px;
        font-size: 13px;
    }
</style>
</head>
<body>

<header>
    <div class="logo">ZX Spectrum!</div>
</header>

<main>
    <div class="panel">
        <h2>Server Links</h2>
        <a class="btn" href="http://server.zx-spectrum.online:5558/" target="_blank">Home Server</a>
        <a class="btn" href="http://zx-spectrum.online:5558/zx-spectrum" target="_blank">Minecraft Server Site</a>
        <div class="dev-build">Dev Build: 0.9.7-beta</div>
    </div>
</main>

<footer>
    &copy; 2026 ZX Spectrum!
</footer>

</body>
</html>
