<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZX Spectrum!</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
    }

    header {
        background-color: #222;
        color: #fff;
        padding: 20px;
        text-align: center;
        font-size: 28px;
        font-weight: bold;
    }

    main {
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .btn {
        display: inline-block;
        padding: 15px 30px;
        font-size: 16px;
        color: #fff;
        background-color: #007acc;
        border: none;
        border-radius: 5px;
        text-decoration: none;
        transition: background 0.2s;
    }

    .btn:hover {
        background-color: #005f99;
    }

    .dev-build {
        font-family: "Courier New", monospace;
        color: #900;
        margin-top: 10px;
    }

    footer {
        margin-top: 50px;
        padding: 20px;
        background-color: #222;
        color: #ccc;
        text-align: center;
        font-size: 14px;
    }
</style>
</head>
<body>
<header>
    ZX Spectrum!
</header>

<main>
    <a class="btn" href="http://server.zx-spectrum.online:5558/" target="_blank">
        My Home Server
    </a>

    <a class="btn" href="http://zx-spectrum.online:5558/zx-spectrum" target="_blank">
        Minecraft Server Site
    </a>

    <div class="dev-build">
        Dev Build: 0.9.7-beta
    </div>
</main>

<footer>
    &copy; 2026 ZX Spectrum!
</footer>
</body>
</html>
